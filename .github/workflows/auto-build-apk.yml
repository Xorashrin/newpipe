name: Auto Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build NewPipe Universal & 8K APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x runCheckstyle -x runKtlint -x checkDependenciesOrder -x lint --stacktrace -DskipFormatKtlint

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NewPipe-Universal-8K-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
